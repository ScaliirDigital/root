name: Pull Request

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run flake check
        run: nix flake check --print-build-logs

  detect:
    name: Detect Changes
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      packages: ${{ steps.resolve.outputs.packages }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            astro-bun:
              - 'packages/astro-bun/**'

      - id: resolve
        name: Resolve test plan
        env:
          CHANGED_PACKAGES: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail

          if [[ "$CHANGED_PACKAGES" == '[]' ]]; then
            echo 'packages=["none"]' >> "$GITHUB_OUTPUT"
          else
            printf 'packages=%s\n' "$CHANGED_PACKAGES" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: ${{ matrix.package == 'none' && 'Nothing to test' || format('Tests / {0}', matrix.package) }}
    needs: detect
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.packages) }}
    steps:
      - name: No package tests required
        if: matrix.package == 'none'
        run: echo "No package tests required."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: matrix.package != 'none'
        with:
          persist-credentials: false

      - name: Setup Bun
        if: matrix.package != 'none'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        if: matrix.package != 'none'
        run: bun install --frozen-lockfile

      - name: Run tests
        if: matrix.package != 'none'
        run: bun test
        working-directory: packages/${{ matrix.package }}
