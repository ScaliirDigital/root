name: Unlock

# Only updates metadata for the tested PR commit; no PR code or artifacts are executed.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Pull Request"]
    types: [completed]

permissions: {}

jobs:
  ready:
    name: Pull Request
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write

      - name: Find PR number
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const run = context.payload.workflow_run;

            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });

            const matches = prs.filter(pr =>
              pr.head.repo?.full_name === run.head_repository.full_name &&
              pr.head.sha === run.head_sha
            );

            if (matches.length !== 1) {
              core.notice('No unique open PR matches the tested commit; skipping.');
              return;
            }

            return matches[0].number;

      - name: Add ready-for-review label
        if: steps.pr.outputs.result != '' && steps.pr.outputs.result != 'null'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ steps.pr.outputs.result }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.PR, 10),
              labels: ['status: ready-for-review'],
            });

      - name: Set commit status
        if: steps.pr.outputs.result != '' && steps.pr.outputs.result != 'null'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'success',
              context: 'Pull Request / Ready',
              description: 'All checks passed',
            });
