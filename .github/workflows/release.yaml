name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  update:
    name: Update
    if: github.repository == 'ScaliirDigital/root'
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      pull-requests: write

    outputs:
      releases: ${{ steps.release.outputs.releases }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.4'
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update releases
        id: release
        uses: ./.github/actions/release-update # zizmor: ignore[self-repository]
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}

  publish:
    name: Publish
    needs: update
    if: >-
      !cancelled() &&
      github.repository == 'ScaliirDigital/root' &&
      needs.update.outputs.releases != '' &&
      needs.update.outputs.releases != '[]'

    permissions:
      contents: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.update.outputs.releases) }}

    uses: ./.github/workflows/publish.yaml # zizmor: ignore[self-repository]
    with:
      release: ${{ toJSON(matrix.release) }}
