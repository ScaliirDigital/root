name: Publish GitHub release
description: Create a draft or finalize a prepared GitHub release

inputs:
  package:
    description: Package name
    required: true
  draft:
    description: Create or verify a draft without publishing it
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Publish GitHub release
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        DRAFT: ${{ inputs.draft }}
      run: |
        set -euo pipefail

        gh auth setup-git --hostname github.com

        args=("publish" "--package=${PACKAGE}")

        case "$DRAFT" in
          true) args+=(--draft) ;;
          false) ;;
          *)
            echo "Invalid draft value: $DRAFT" >&2
            exit 1
            ;;
        esac

        nix run .#release -- "${args[@]}"
