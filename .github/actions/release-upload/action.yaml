name: Upload release archives
description: Generate SHA256SUMS and upload verified binary archives to a GitHub release

inputs:
  package:
    description: Package name
    required: true
  version:
    description: Release version
    required: true
  tag:
    description: Release tag
    required: true

runs:
  using: composite
  steps:
    - name: Generate checksums and upload release assets
      shell: bash
      working-directory: artifacts
      env:
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail

        archives=(
          "${PACKAGE}-${VERSION}-linux-amd64.tar.gz"
          "${PACKAGE}-${VERSION}-linux-arm64.tar.gz"
        )

        sha256sum -- "${archives[@]}" > SHA256SUMS

        gh release upload "$TAG" "${archives[@]}" SHA256SUMS --clobber
